      <stop offset="0%" style="stop-color:#0D4F8B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0B7B8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Virus emoji as text -->
