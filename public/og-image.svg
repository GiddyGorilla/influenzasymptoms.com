  <!-- Title -->
  <text x="600" y="380" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="white">InfluenzaSymptoms.com</text>
  <!-- Subtitle -->
  <text x="600" y="440" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" fill="rgba(255,255,255,0.85)">Evidence-based flu information</text>
