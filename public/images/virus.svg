<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="vGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c9a92" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3db5a8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="vGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2540" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2a4a7f" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Background circles -->
  <circle cx="200" cy="150" r="140" fill="url(#vGrad1)"/>
  <circle cx="200" cy="150" r="100" stroke="#2c9a92" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="200" cy="150" r="60" stroke="#3db5a8" stroke-width="0.3" opacity="0.2"/>
  <!-- Virus body -->
  <circle cx="200" cy="150" r="45" fill="url(#vGrad2)"/>
  <circle cx="200" cy="150" r="45" stroke="#3db5a8" stroke-width="1" opacity="0.5"/>
  <!-- Spikes -->
  <g stroke="#3db5a8" stroke-width="2.5" stroke-linecap="round">
    <line x1="200" y1="95" x2="200" y2="75"/>
    <line x1="230" y1="100" x2="245" y2="85"/>
    <line x1="250" y1="135" x2="268" y2="128"/>
    <line x1="252" y1="168" x2="270" y2="175"/>
    <line x1="232" y1="198" x2="248" y2="212"/>
    <line x1="200" y1="205" x2="200" y2="225"/>
    <line x1="168" y1="198" x2="152" y2="212"/>
    <line x1="148" y1="168" x2="130" y2="175"/>
    <line x1="150" y1="135" x2="132" y2="128"/>
    <line x1="170" y1="100" x2="155" y2="85"/>
  </g>
  <!-- Spikes small -->
  <g stroke="#3db5a8" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="200" y1="103" x2="200" y2="95"/>
    <line x1="215" y1="107" x2="222" y2="97"/>
    <line x1="245" y1="150" x2="255" y2="150"/>
    <line x1="215" y1="193" x2="222" y2="203"/>
    <line x1="185" y1="193" x2="178" y2="203"/>
    <line x1="155" y1="150" x2="145" y2="150"/>
    <line x1="185" y1="107" x2="178" y2="97"/>
  </g>
  <!-- Inner detail -->
  <circle cx="195" cy="145" r="6" fill="#3db5a8" opacity="0.3"/>
  <circle cx="208" cy="148" r="4" fill="#3db5a8" opacity="0.2"/>
  <circle cx="201" cy="158" r="5" fill="#3db5a8" opacity="0.25"/>
  <!-- Floating particles -->
  <circle cx="140" cy="100" r="3" fill="#3db5a8" opacity="0.3"/>
  <circle cx="270" cy="120" r="2.5" fill="#3db5a8" opacity="0.25"/>
  <circle cx="260" cy="200" r="3.5" fill="#3db5a8" opacity="0.2"/>
  <circle cx="130" cy="190" r="2" fill="#3db5a8" opacity="0.3"/>
  <circle cx="160" cy="80" r="2" fill="#2c9a92" opacity="0.2"/>
  <circle cx="290" cy="180" r="2" fill="#2c9a92" opacity="0.25"/>
</svg>