<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" fill="none">
  <defs>
    <linearGradient id="tlLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c9a92"/>
      <stop offset="50%" stop-color="#3db5a8"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="500" height="200" rx="16" fill="#f8fafc"/>
  <!-- Timeline line -->
  <line x1="60" y1="100" x2="460" y2="100" stroke="url(#tlLine)" stroke-width="3" stroke-linecap="round"/>
  <!-- Day markers -->
  <!-- Day 1 -->
  <circle cx="100" cy="100" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="100" y="105" text-anchor="middle" font-family="system-ui" font-size="10" fill="#f59e0b" font-weight="700">1</text>
  <text x="100" y="140" text-anchor="middle" font-family="system-ui" font-size="12" fill="#0a2540" font-weight="600">Onset</text>
  <text x="100" y="156" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6b7280">Mild symptoms</text>
  <!-- Day 2 -->
  <circle cx="190" cy="100" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="190" y="105" text-anchor="middle" font-family="system-ui" font-size="10" fill="#f59e0b" font-weight="700">2</text>
  <text x="190" y="140" text-anchor="middle" font-family="system-ui" font-size="12" fill="#0a2540" font-weight="600">Escalation</text>
  <text x="190" y="156" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6b7280">Fever, aches</text>
  <!-- Day 3 -->
  <circle cx="280" cy="100" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="280" y="105" text-anchor="middle" font-family="system-ui" font-size="10" fill="#dc2626" font-weight="700">3</text>
  <text x="280" y="80" text-anchor="middle" font-family="system-ui" font-size="12" fill="#dc2626" font-weight="600">Peak</text>
  <text x="280" y="64" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6b7280">Worst symptoms</text>
  <!-- Day 5 -->
  <circle cx="370" cy="100" r="12" fill="#e6f7f5" stroke="#2c9a92" stroke-width="2.5"/>
  <text x="370" y="105" text-anchor="middle" font-family="system-ui" font-size="10" fill="#2c9a92" font-weight="700">5</text>
  <text x="370" y="140" text-anchor="middle" font-family="system-ui" font-size="12" fill="#0a2540" font-weight="600">Recovery</text>
  <text x="370" y="156" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6b7280">Improving</text>
  <!-- Day 7 -->
  <circle cx="440" cy="100" r="12" fill="#e6f7f5" stroke="#2c9a92" stroke-width="2.5"/>
  <text x="440" y="105" text-anchor="middle" font-family="system-ui" font-size="10" fill="#2c9a92" font-weight="700">7</text>
  <text x="440" y="140" text-anchor="middle" font-family="system-ui" font-size="12" fill="#0a2540" font-weight="600">Resolution</text>
  <text x="440" y="156" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6b7280">Almost better</text>
</svg>