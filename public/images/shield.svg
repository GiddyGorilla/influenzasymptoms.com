<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="shGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#2a4a7f"/>
    </linearGradient>
    <linearGradient id="shCheck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c9a92"/>
      <stop offset="100%" stop-color="#3db5a8"/>
    </linearGradient>
  </defs>
  <!-- Background glow -->
  <ellipse cx="100" cy="120" rx="80" ry="90" fill="#e6f7f5" opacity="0.4"/>
  <!-- Shield shape -->
  <path d="M100 20 L175 50 L175 130 C175 185 100 230 100 230 C100 230 25 185 25 130 L25 50 Z" fill="url(#shGrad)" stroke="#2c9a92" stroke-width="2"/>
  <!-- Shield inner highlight -->
  <path d="M100 40 L160 65 L160 130 C160 175 100 212 100 212 C100 212 40 175 40 130 L40 65 Z" fill="none" stroke="#3db5a8" stroke-width="1" opacity="0.3"/>
  <!-- Checkmark -->
  <path d="M75 125 L93 145 L130 95" stroke="url(#shCheck)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Cross (subtle) -->
  <g stroke="#3db5a8" stroke-width="1.5" opacity="0.25">
    <line x1="100" y1="150" x2="100" y2="175"/>
    <line x1="87.5" y1="162.5" x2="112.5" y2="162.5"/>
  </g>
</svg>