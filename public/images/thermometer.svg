<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <defs>
    <linearGradient id="thGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="thGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="200" r="60" fill="#fee2e2" opacity="0.3"/>
  <!-- Thermometer stem -->
  <rect x="90" y="40" width="20" height="110" rx="10" fill="url(#thGrad2)"/>
  <!-- Mercury -->
  <rect x="94" y="100" width="12" height="50" rx="6" fill="url(#thGrad)"/>
  <!-- Bulb -->
  <circle cx="100" cy="170" r="22" fill="url(#thGrad2)" stroke="#dc2626" stroke-width="2"/>
  <circle cx="100" cy="170" r="16" fill="url(#thGrad)"/>
  <!-- Highlight -->
  <ellipse cx="92" cy="162" rx="6" ry="4" fill="white" opacity="0.3"/>
  <!-- Tick marks -->
  <g stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round">
    <line x1="112" y1="60" x2="118" y2="60"/>
    <line x1="112" y1="80" x2="118" y2="80"/>
    <line x1="112" y1="100" x2="118" y2="100"/>
    <line x1="112" y1="120" x2="118" y2="120"/>
    <line x1="112" y1="140" x2="118" y2="140"/>
  </g>
  <!-- Temperature labels -->
  <text x="122" y="84" font-family="system-ui" font-size="10" fill="#9ca3af">98.6</text>
  <text x="122" y="104" font-family="system-ui" font-size="10" fill="#dc2626" font-weight="600">100.4</text>
  <!-- Wavy heat lines -->
  <g stroke="#ef4444" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
    <path d="M70 230 Q80 224 90 230 Q100 236 110 230 Q120 224 130 230"/>
    <path d="M80 240 Q90 234 100 240 Q110 246 120 240"/>
  </g>
</svg>